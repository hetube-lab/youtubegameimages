      :root {

      .moveY{animation-name:ball_bounceY1,ball_bounceY2,ball_bounceY3;animation-duration:calc(var(--t1)/2),calc(var(--t2)/2),calc(var(--t3)/2);animation-direction:  alternate,alternate,alternate;animation-iteration-count: 2,2,2;animation-delay: 0s,var(--t2Delay),var(--t3Delay);animation-timing-function: ease-out,ease-out,ease-out;animation-fill-mode: forwards}     
      
      @keyframes ball_bounceY1 {
        0%{transform:translateY(-5px)}
        100%{transform:translateY(var(--y1))}
      }
      @keyframes ball_bounceY2 {
        0%{transform:translateY(-5px)}
        100%{transform:translateY(var(--y2))}
      }
      @keyframes ball_bounceY3 {
        0%{transform:translateY(-5px)}
        100%{transform:translateY(var(--y3))}

            .marquee-container {
            overflow: hidden; /* Hides the duplicate content initially */
            white-space: nowrap; /* Prevents text from wrapping to the next line */
            display: flex; /* Uses flexbox for alignment */
            box-sizing: border-box;
            }

            .marquee-content {
            display: inline-block;
            animation: scroll 4s linear infinite;
            /* Ensures child items don't shrink, maintaining total width */
            flex-shrink: 0; 
            }
            
            /* Define the animation */
            @keyframes scroll {
            from {
                transform: translateX(0); /* Start at original position */
            }
            to {
                /* Move left by exactly half the total width (the width of one copy) */
                transform: translateX(-50%); 
            }
            }
            @keyframes horizontal-shaking {
                0% { transform: translateY(0) }
                25% { transform: translateY(2px) }
                50% { transform: translateY(-2px) }
                75% { transform: translateY(1px) }
                100% { transform: translateY(0) }}


            @keyframes carsetmove {
                0% { transform: translateX(0) }
                100% { transform: translateX(1600%) }
            }
